  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <!-- Inline critical CSS for faster FCP -->
  <style>
    html { background: #F8FAF9; color: #252C2B; color-scheme: light; }
    html.dark { background: #151819; color: #F0F3F2; color-scheme: dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #root {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .min-h-screen {
      min-height: 100vh;
    }

    .flex {
      display: flex;
    }

    .items-center {
      align-items: center;
    }

    .justify-center {
      justify-content: center;
    }

    .bg-background {
      background-color: hsl(var(--background, 150 24% 98%));
    }

    .rounded-full {
      border-radius: 9999px;
    }

    .animate-spin {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <meta property="og:title" content="WeChurch 我們就是教會">
  <meta name="twitter:title" content="WeChurch 我們就是教會">
  <meta property="og:description" content="一起，活出耶穌的豐盛生命">
  <meta name="twitter:description" content="一起，活出耶穌的豐盛生命">
</head>

<body>
  <div id="root"></div>
  <script>
    (function () {
      var errorCount = 0;
      function handleFatalError(msg) {
        errorCount++;
        if (errorCount > 3) return;
        console.error('[GlobalErrorHandler]', msg);
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim().length < 50)) {
          root.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:80vh;padding:24px;font-family:system-ui,sans-serif;">' +
            '<div style="text-align:center;max-width:360px;">' +
            '<p style="font-size:18px;font-weight:600;margin-bottom:12px;">頁面載入發生問題</p>' +
            '<p style="font-size:14px;color:#666;margin-bottom:20px;">請重新載入頁面，或返回首頁</p>' +
            '<button onclick="location.reload()" style="padding:8px 20px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer;margin-right:8px;font-size:14px;">重新載入</button>' +
            '<button onclick="location.href=\'/\'" style="padding:8px 20px;border-radius:8px;border:none;background:#14685B;color:#fff;cursor:pointer;font-size:14px;">返回首頁</button>' +
            '</div></div>';
        }
      }
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.indexOf('Loading chunk') !== -1 || e.message.indexOf('module script') !== -1 || e.message.indexOf('dynamically imported') !== -1)) {
          handleFatalError(e.message);
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        var msg = e.reason ? (e.reason.message || String(e.reason)) : '';
        if (msg.indexOf('Loading chunk') !== -1 || msg.indexOf('module script') !== -1 || msg.indexOf('dynamically imported') !== -1 || msg.indexOf('Failed to fetch') !== -1) {
          handleFatalError(msg);
        }
      });
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
