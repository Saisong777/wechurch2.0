services:
  db:
    image: postgres:16-alpine
    container_name: wechurch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wechurch_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wechurch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wechurch_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wechurch_postgres_data:
