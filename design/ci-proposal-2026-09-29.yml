# Pending GitHub workflow permission; this file is not an active workflow.
name: WeChurch CI

on:
  pull_request:
    branches: [main, integration, codex/bible-study-integration]
  push:
    branches: [main, integration, codex/bible-study-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wechurch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Isolated database and authorization regressions
        env:
          INTEGRITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:integrity
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
